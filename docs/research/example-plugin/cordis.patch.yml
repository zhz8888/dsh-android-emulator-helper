# dsh bundle patch for dsh-example-host-tool.
#
# Top-level YAML ARRAY of @deepseek-ai/cordis-plugin-include PatchOptions.
# `insert:` appends rows; a bare `- id: ...` mapping with no `insert:` key
# OVERRIDES the config of an existing row with that id (wholesale replacement,
# so restate every field you want to keep). `disabled: true` (or a `!!js`
# expression yielding a boolean) turns a row off without deleting it.
#
# Every entry must carry an `id` (patches index rows by id) and, for inserted
# rows, a `name` (the plugin module specifier).

- insert:
    - id: example-host-tool
      name: 'dsh-example-host-tool'
      # Seed values for the volatile Config below. Only fields marked
      # `.volatile()` are editable from the Settings UI afterwards.
      config:
        prefix: 'host-run'
        timeoutMs: 15000
        maxBytes: 65536
        maxArgv: 64

# Inserting a second row of the same module with a distinct id gives you a
# second, independently-configured instance (each gets its own Config form):
#
# - insert:
#     - id: example-host-tool-slow
#       name: 'dsh-example-host-tool'
#       config:
#         prefix: 'host-run-slow'
#         timeoutMs: 300000
