<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 199 985 627" width="985" height="627" role="img">
  <title>Android emulator helper</title>
  <!--
    The Android robot head, from the artwork supplied as `android.svg`, at its
    original `#2c2c2c`.

    DSH renders `package.json.icon` as an <img> whose src is a base64 data URL, so
    the SVG is an isolated document: it cannot see the host page's
    `body[data-ds-dark-theme]`, and `currentColor` would resolve to black. It can,
    however, see `prefers-color-scheme`, and that is the exact lever we need — DSH
    Desktop pushes the user's theme preference into Electron as
    `nativeTheme.themeSource = spec.readThemeSource()` (electron-runtime), and
    `themeSource` is precisely what drives `prefers-color-scheme` in every renderer
    frame. Light / dark / system therefore all agree between the app chrome and
    this image, and the fill below inverts with the theme.

    `#d3d3d3` is the exact RGB inversion of `#2c2c2c` (255 - 44 = 211), which also
    happens to balance the pair: 13.97:1 against the light background `#ffffff`
    and 11.98:1 against the dark one `#151517`.

    The fill also sits on the element as a presentation attribute, so a renderer
    without CSS support (an SVG-to-PNG pipeline, a strict validator) still draws
    the light-theme colour instead of nothing. Presentation attributes lose to any
    CSS rule, which is what lets the media query override it.
  -->
  <style>
    path { fill: #2c2c2c; }
    @media (prefers-color-scheme: dark) {
      path { fill: #d3d3d3; }
    }
  </style>
